<div class="text-editor">
	<code-mirror
		ng-model="$ctrl.text"
		mode="$ctrl.modeToUse"
		theme="default"
		on-change="$ctrl.onChange()"
	/>
</div>
<div class="editor-error-overlay" ng-if="$ctrl.syntaxError" ng-class="{'show': $ctrl.syntaxError, 'hide': !$ctrl.syntaxError}">
	{{$ctrl.syntaxError}}
</div>
